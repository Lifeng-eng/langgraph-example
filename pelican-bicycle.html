<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鵜鶘骑行</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #79c8d5;
      font-family: Georgia, "Noto Serif SC", serif;
    }
    svg { width: min(100vw, 1100px); height: auto; display: block; }
    .wheel, #crank { transform-box: fill-box; transform-origin: center; }
    .road-mark { animation: road 1.1s linear infinite; }
    .cloud { animation: drift 14s linear infinite; }
    .cloud.slow { animation-duration: 21s; animation-direction: reverse; }
    .pelican { animation: bob .5s ease-in-out infinite alternate; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s steps(1) infinite; }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-180px); } }
    @keyframes drift { from { transform: translateX(-80px); } to { transform: translateX(1160px); } }
    @keyframes bob { to { transform: translateY(-7px); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96%, 98% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <svg viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
    <title id="title">鵜鶘骑自行车的动画</title>
    <desc id="desc">一只鵜鶘沿着海滨公路骑自行车，车轮和踏板不断转动。</desc>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#68c7dc"/><stop offset="1" stop-color="#d7f0dd"/></linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#167d9c"/><stop offset="1" stop-color="#48aac0"/></linearGradient>
    </defs>

    <rect width="1100" height="680" fill="url(#sky)" />
    <g fill="#f9fcf0" opacity=".9">
      <path class="cloud" d="M-30 110c28-43 80-39 94 2 33-35 92-5 72 35H-48c-13-12-5-29 18-37z" />
      <path class="cloud slow" d="M640 70c23-31 70-29 83 2 28-24 70 3 56 28H620c-12-10-3-24 20-30z" />
    </g>
    <circle cx="909" cy="128" r="54" fill="#ffe39b" />
    <path d="M0 325C115 280 188 349 293 309s188 25 283-8 218-21 302-44 151 25 222 3v196H0z" fill="url(#sea)" />
    <g fill="none" stroke="#bce6df" stroke-width="5" opacity=".7">
      <path d="M30 374q45-18 90 0t90 0"/><path d="M735 354q45-18 90 0t90 0"/><path d="M418 420q35-13 70 0t70 0"/>
    </g>
    <path d="M0 468h1100v212H0z" fill="#f0b964" />
    <path d="M0 490h1100" stroke="#25404a" stroke-width="11" />
    <g stroke="#fff5ce" stroke-width="14" stroke-linecap="round">
      <path class="road-mark" d="M-40 578h96m84 0h96m84 0h96m84 0h96m84 0h96m84 0h96m84 0h96m84 0h96" />
    </g>
    <text x="550" y="626" text-anchor="middle" fill="#25404a" font-size="23" letter-spacing="5">COASTAL CRUISE</text>

    <g class="pelican">
      <!-- bicycle -->
      <g fill="none" stroke="#183f51" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <g id="rear-wheel" class="wheel">
          <circle cx="403" cy="519" r="68" stroke="#193c4d" />
          <path d="M335 519h136M403 451v136M355 471l96 96M451 471l-96 96" stroke-width="4" opacity=".75" />
          <circle cx="403" cy="519" r="10" fill="#f8d66e" />
        </g>
        <g id="front-wheel" class="wheel">
          <circle cx="650" cy="519" r="68" stroke="#193c4d" />
          <path d="M582 519h136M650 451v136M602 471l96 96M698 471l-96 96" stroke-width="4" opacity=".75" />
          <circle cx="650" cy="519" r="10" fill="#f8d66e" />
        </g>
        <path d="M403 519l96-145 81 145H403l151 0 96-145" />
        <path d="M499 374h85l66-36M499 374l-38-18M650 338l17 29" />
      </g>
      <circle cx="554" cy="519" r="25" fill="#f8d66e" stroke="#183f51" stroke-width="8" />
      <g id="crank" fill="none" stroke="#183f51" stroke-width="8" stroke-linecap="round">
        <path d="M554 519h42M554 519h-42" />
        <path d="M584 519h23M501 519h23" />
      </g>
      <!-- Each foot is calculated from the matching rotating pedal. -->
      <g fill="none" stroke="#dd9b49" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
        <path id="back-leg" d="M513 406L545 466L512 519" />
        <path id="front-leg" d="M536 405L575 462L596 519" />
      </g>
      <!-- body, wing, neck -->
      <path d="M435 368q-26-104 61-145 95-44 145 48 25 46-14 138l-98 20q-81 8-94-61z" fill="#f5f1d8" stroke="#183f51" stroke-width="8" />
      <path d="M519 300q24 10 39 42-28 28-72 24-15-36 33-66z" fill="#7baeb2" stroke="#183f51" stroke-width="7" />
      <path d="M488 237q-6-81 45-104 56-23 98 20 23 24 6 65l-44 63z" fill="#f5f1d8" stroke="#183f51" stroke-width="8" />
      <!-- beak and pouch -->
      <path d="M542 193q84-33 182-10-74 22-171 57l-21-18z" fill="#f3b85a" stroke="#183f51" stroke-width="8" stroke-linejoin="round" />
      <path d="M549 222q91 5 150-16-52 62-132 58-26-7-18-42z" fill="#e99175" stroke="#183f51" stroke-width="8" />
      <circle cx="550" cy="174" r="12" fill="#183f51" />
      <ellipse class="blink" cx="550" cy="174" rx="12" ry="12" fill="#183f51" />
      <path d="M499 146q31-48 80-32" fill="none" stroke="#f4c455" stroke-width="16" stroke-linecap="round" />
      <path d="M621 317q-4 54-39 77" fill="none" stroke="#183f51" stroke-width="8" stroke-linecap="round" />
      <!-- Webbed feet sit directly over the two pedal centres. -->
      <g fill="none" stroke="#dd9b49" stroke-width="18" stroke-linecap="round">
        <path id="back-foot" />
        <path id="front-foot" />
      </g>
    </g>
  </svg>
  <script>
    const crank = document.querySelector('#crank');
    const wheels = [
      { element: document.querySelector('#rear-wheel'), center: [403, 519] },
      { element: document.querySelector('#front-wheel'), center: [650, 519] },
    ];
    const legs = [
      { hip: [513, 406], path: document.querySelector('#back-leg'), foot: document.querySelector('#back-foot'), phase: Math.PI },
      { hip: [536, 405], path: document.querySelector('#front-leg'), foot: document.querySelector('#front-foot'), phase: 0 },
    ];
    const center = [554, 519];
    const crankRadius = 42;
    const thigh = 78;
    const shin = 80;
    const cadenceMs = 700;

    function drawLeg({ hip, path, foot: footPath, phase }, angle) {
      const pedalAngle = angle + phase;
      const foot = [
        center[0] + Math.cos(pedalAngle) * crankRadius,
        center[1] + Math.sin(pedalAngle) * crankRadius,
      ];
      const dx = foot[0] - hip[0];
      const dy = foot[1] - hip[1];
      const distance = Math.hypot(dx, dy);
      const direction = Math.atan2(dy, dx);
      const bend = Math.acos(Math.min(1, Math.max(-1, (thigh ** 2 + distance ** 2 - shin ** 2) / (2 * thigh * distance))));
      const knee = [hip[0] + Math.cos(direction - bend) * thigh, hip[1] + Math.sin(direction - bend) * thigh];
      path.setAttribute('d', `M${hip[0]} ${hip[1]} L${knee[0].toFixed(1)} ${knee[1].toFixed(1)} L${foot[0].toFixed(1)} ${foot[1].toFixed(1)}`);
      const tangent = [-Math.sin(pedalAngle), Math.cos(pedalAngle)];
      footPath.setAttribute('d', `M${(foot[0] - tangent[0] * 10).toFixed(1)} ${(foot[1] - tangent[1] * 10).toFixed(1)} L${(foot[0] + tangent[0] * 13).toFixed(1)} ${(foot[1] + tangent[1] * 13).toFixed(1)}`);
    }

    function animate(time) {
      const angle = (time % cadenceMs) / cadenceMs * 360;
      const radians = angle * Math.PI / 180;
      crank.setAttribute('transform', `rotate(${angle} ${center[0]} ${center[1]})`);
      wheels.forEach(({ element, center: wheelCenter }) => element.setAttribute('transform', `rotate(${angle * 1.7} ${wheelCenter[0]} ${wheelCenter[1]})`));
      legs.forEach((leg) => drawLeg(leg, radians));
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
